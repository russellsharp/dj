# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches:
      - main
      - "branch*"

  pull_request_target:
    branches:
      - 'main'
      - 'branch*'
    types: [ opened, synchronize, reopened ]

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          cancel_others: 'true'
          concurrent_skipping: 'same_content_newer' # Cancels older runs
          skip_after_successful_duplicate: 'true'

      - id: report-check
        if: steps.skip_check.outputs.should_skip == 'true'
        run:
          echo "Skipping build because of concurrent workflow being run with newer content."
        
  build:
    runs-on: ubuntu-latest
    environment: default
    needs: pre-check      
    if: needs.pre-check.outputs.should_skip != 'true'

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x' # Forces the runner to use the .NET 11 SDK
    
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/dotnet
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      env: 
        DJ_SECURITY_KEY: ${{ secrets.DJ_SECURITY_KEY }}
        DJ_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        DJ_USERS_DATABASE_PATH: data/users.db
        DJ_OPENIDDICT_DATABASE_PATH: data/openiddict.db
        ASPNETCORE_ENVIRONMENT: Development
      run: |
        dotnet test --no-build --settings .runsettings --verbosity normal -- --diagnostic 
        
    - name: Upload dj.test.system and dj.test Test Logs On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-test-results
        path: |
          ./test/dj.test.system/bin/**/**/TestResults/*
          ./test/dj.test/bin/**/**/TestResults/*
