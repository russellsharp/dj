# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:

  pull_request_target:
    branches:
      - "main"
      - "branch*"
    types: [ opened, synchronize, reopened ]


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x' # Forces the runner to use the .NET 11 SDK
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      env: 
        DJ_SECURITY_KEY: ${{ secrets.DJ_SECURITY_KEY }}
        DJ_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        DJ_USERS_DATABASE_PATH: data/users.db
        DJ_OPENIDDICT_DATABASE_PATH: data/openiddict.db
        ASPNETCORE_ENVIRONMENT: Development
      run: |
        dotnet test --no-build --verbosity normal -- --diagnostic --settings .runsettings
    - name: Upload Test Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-test-results
        path: ./home/runner/work/dj/dj/test/dj.test/bin/Debug/net11.0/TestResults/*.log